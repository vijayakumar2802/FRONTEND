<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Cards</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="cards">

        
        <div class="card">

            <div class="card-top">
                <span>🎨</span>
            </div>

            <div class="card-content">
                <span class="tag">Design</span>

                <h2>Learn CSS</h2>

                <p>
                    Practice colours, spacing, shadows,
                    borders, and hover effects.
                </p>

                <button>Start learning</button>
            </div>

        </div>


        
        <div class="card">

            <div class="card-top">
                <span>💻</span>
            </div>

            <div class="card-content">
                <span class="tag">Code</span>

                <h2>Build Projects</h2>

                <p>
                    Create small web projects to improve
                    your HTML and CSS skills.
                </p>

                <button>View project</button>
            </div>

        </div>


        
        <div class="card">

            <div class="card-top">
                <span>🚀</span>
            </div>

            <div class="card-content">
                <span class="tag">Growth</span>

                <h2>Practice Daily</h2>

                <p>
                    Even 20 minutes of practice every
                    day makes a visible difference.
                </p>

                <button>Keep going</button>
            </div>

        </div>

    </section>

</body>
</html>
