<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h2>Student Registration Form</h2>

    <form>
        <table>

            <tr>
                <td><label for="name">Name:</label></td>
                <td><input type="text" id="name" name="name" required></td>
            </tr>

            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>

            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" required></td>
            </tr>

            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="number" id="age" name="age" min="1" max="100"></td>
            </tr>

            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><input type="date" id="dob" name="dob"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </td>
            </tr>

            <tr>
                <td><label for="course">Course:</label></td>
                <td>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option>B.Sc Computer Science</option>
                        <option>BCA</option>
                        <option>B.Com</option>
                        <option>BBA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Skills:</td>
                <td>
                    <input type="checkbox" id="html" name="skill" value="HTML">
                    <label for="html">HTML</label>

                    <input type="checkbox" id="css" name="skill" value="CSS">
                    <label for="css">CSS</label>

                    <input type="checkbox" id="js" name="skill" value="JavaScript">
                    <label for="js">JavaScript</label>
                </td>
            </tr>

            <tr>
                <td><label for="address">Address:</label></td>
                <td>
                    <textarea id="address" name="address" rows="4" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
